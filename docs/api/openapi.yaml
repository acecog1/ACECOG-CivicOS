components:
  schemas:
    LegalStatus:
      type: object
      description: Legal-status axis (8.0, ASR-08). Binding only with a Legal Effect Declaration (invariant 26 ASR-STATUS-001).
      required:
      - value
      properties:
        value:
          enum:
          - Advisory
          - Consultative
          - Binding
        legal_effect_declaration_id:
          type:
          - string
          - 'null'
        enabling_authority:
          type:
          - string
          - 'null'
        effective_date:
          type:
          - string
          - 'null'
    Status:
      type: object
      description: The four separate status axes every decision, commitment, and published result carries (8.0).
      required:
      - lifecycle_state
      - legal_status
      - delivery_readiness
      - epistemic_class
      properties:
        lifecycle_state:
          enum:
          - Draft
          - Proposed
          - Validated
          - Deliberated
          - Approved
          - Baselined
          - Optimized
          - Resolved
          - Committed
          - Executing
          - Measured
          - Reconciled
          - Rejected
          - Remanded
          - Deferred
          - Suspended
          - Superseded
          - Canceled
          - Exception
        legal_status:
          $ref: '#/components/schemas/LegalStatus'
        delivery_readiness:
          enum:
          - Proposed
          - Funded but incomplete
          - Operationally verified
          - Breached
          - Not applicable
        epistemic_class: &id003
          enum:
          - Observed
          - Reported
          - Estimated
          - Assumed
          - Scenario output
          - Hypothesis
          - Not applicable
    ObjectHeader:
      type: object
      description: Fields every first-class object carries (Section 7 preamble).
      required:
      - id
      - version_id
      - object_type
      - civic_body_id
      - created_in_transaction
      properties:
        id:
          type: string
          description: Stable object identity (Section 7).
        version_id:
          type: string
          description: Immutable version identity.
        object_type: &id001
          type: string
        civic_body_id:
          type:
          - string
          - 'null'
        owner:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
        effective_from:
          type:
          - string
          - 'null'
        effective_to:
          type:
          - string
          - 'null'
        authority_basis:
          type:
          - string
          - 'null'
          description: Authority or decision that permitted this version.
        confidence:
          type:
          - number
          - 'null'
        supersedes:
          type:
          - string
          - 'null'
          description: Prior version this one replaces (lineage).
        created_in_transaction: *id001
    Refusal:
      type: object
      description: Why a command was refused. Refusals are themselves recorded transactions (8.1).
      required:
      - code
      - reason
      properties:
        code:
          enum:
          - AUTHORITY_MISSING
          - AI_CONFIRMATION_REQUIRED
          - ELIGIBILITY
          - ATTESTATION_TIER
          - RECUSED
          - OPEN_MEETING_GUARD
          - LAYER_RULE
          - PARTICIPATION_FEE
          - SELF_APPOINTMENT
          - SCHEMA
          - NOT_FOUND
          - VERSION_CONFLICT
          - HARD_CONSTRAINT
          - NOT_PSD
          - NOT_COMMIT_ELIGIBLE
          - DOUBLE_ALLOCATION
          - BASELINE_IMMUTABLE
          - EVIDENCE_NOT_ADOPTED
          - RETENTION
          - ENVELOPE_INVALID
          - STATE
          - CHANGE_MISMATCH
          - CHANGE_ALREADY_APPLIED
          - APPROVAL_MISMATCH
          - APPROVAL_ALREADY_USED
          - SELF_GRANT
          - WILDCARD_GRANT
        reason: *id001
        invariant_id:
          type:
          - string
          - 'null'
          description: Section 14 invariant ID, e.g. GOV-AUTHPATH-001.
        control_id:
          type:
          - string
          - 'null'
          description: Assurance Control (43.2) or requirement ID.
        conflicting_layer:
          type:
          - string
          - 'null'
          description: Protection layer (14.0) a configuration conflicts with.
    Escalation:
      type: object
      description: An action routed to human authority instead of being decided automatically (5.11, 8.7).
      required:
      - exception_proposition_id
      - authority_required
      - governing_conflict
      properties:
        exception_proposition_id: *id001
        authority_required: *id001
        governing_conflict: *id001
        failed_tests:
          type: array
          items: *id001
    CommandEnvelope:
      type: object
      description: Wrapper for every state-changing command (11.6.2). The same envelope is used by every client (11.6.1).
      required:
      - command_id
      - actor_id
      - client
      - payload
      properties:
        command_id:
          type: string
          description: 'Idempotency key: resending the same command_id returns the original result and changes nothing (8.1).'
        actor_id: *id001
        client:
          enum:
          - desktop
          - assistant
          - mobile
          - integration
        human_confirmation:
          type:
          - object
          - 'null'
          description: 'Required when client is ''assistant'': the human who reviewed and confirmed the drafted command (24.3,
            UIX-NEUTRAL-002).'
          properties:
            confirmed_by: *id001
            reviewed_payload_hash: *id001
        payload:
          type: object
    CommandResult:
      type: object
      required:
      - transaction_id
      - outcome
      - bound_versions
      properties:
        transaction_id: *id001
        outcome:
          enum:
          - accepted
          - refused
          - escalated
        event_ids:
          type: array
          items: *id001
        result:
          type:
          - object
          - 'null'
        refusal:
          oneOf:
          - $ref: '#/components/schemas/Refusal'
          - type: 'null'
        escalation:
          oneOf:
          - $ref: '#/components/schemas/Escalation'
          - type: 'null'
        bound_versions:
          type: object
          description: Versions in force this transaction is bound to (8.9 version binding).
        status:
          oneOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
    Event:
      type: object
      description: Entry in the append-only, hash-chained event log (11.3, ASR-04).
      required:
      - seq
      - event_id
      - type
      - transaction_id
      - at
      - data
      - prev_hash
      - hash
      properties:
        seq:
          type: integer
        event_id: *id001
        type: *id001
        transaction_id: *id001
        at: *id001
        data:
          type: object
        prev_hash: *id001
        hash: *id001
    DecisionProvenancePacket:
      type: object
      description: 'Section 9: everything needed to reconstruct why a decision occurred.'
      required:
      - decision_id
      - inputs
      - governance
      - model
      - run
      - analysis
      - deliberation
      - disposition
      - outcome
      - lineage
      properties:
        inputs:
          type: object
        governance:
          type: object
        model:
          type: object
        run:
          type: object
        analysis:
          type: object
        deliberation:
          type: object
        disposition:
          type: object
        outcome:
          type: object
        lineage:
          type: object
        decision_id: *id001
        status:
          $ref: '#/components/schemas/Status'
    Payload_civic_bodies_create:
      type: object
      required:
      - name
      - founding_members
      properties:
        name: *id001
        jurisdiction: *id001
        gml_level:
          enum:
          - 0
          - 1
          - 2
          - 3
        founding_members:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - actor_id
            - display_name
            properties:
              actor_id: *id001
              display_name: *id001
              roles:
                type: array
                items: *id001
    Payload_governance_processes_adopt:
      type: object
      required:
      - civic_body_id
      - decision_classes
      properties:
        civic_body_id: *id001
        decision_classes:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - name
            - method
            - approval_threshold
            - min_attestation
            properties:
              name: *id001
              method:
                enum:
                - direct_vote
                - consent
              approval_threshold: &id002
                type: number
                minimum: 0
                maximum: 1
              quorum: *id002
              min_attestation:
                enum:
                - self_attested
                - verified
                description: Minimum identity tier to take part in this decision class (17.5 eligibility assurance; CL-028).
              min_attestation_confidence:
                type: number
                minimum: 0
                maximum: 1
                description: Below this, a result is flagged low-confidence and excluded from GML-2+ commitment (invariant
                  13). Default 0.75.
              participation_fee:
                type: number
                description: Must be 0; any fee is refused (invariant 24 TRU-ACCESS-001).
              delegation_disclosure_threshold: *id002
              delegation_reconfirm_days:
                type: integer
                minimum: 1
    Payload_authorities_grant:
      type: object
      required:
      - civic_body_id
      - grantee_actor_id
      - actions
      properties:
        civic_body_id: *id001
        grantee_actor_id: *id001
        actions:
          type: array
          items: *id001
        monitoring_role:
          type: boolean
          description: Approval or monitoring authority (12.0.1).
        selected_by_decision_id:
          type:
          - string
          - 'null'
        rotation_terms:
          type:
          - string
          - 'null'
    Payload_delegation_envelopes_adopt:
      type: object
      required:
      - civic_body_id
      - decision_class
      - tolerance
      properties:
        civic_body_id: *id001
        decision_class: *id001
        tolerance:
          type: number
          description: Largest reallocation the envelope may resolve automatically.
        confidence_threshold:
          description: 0-1, default 0.90 (5.9).
        min_reversibility:
          description: 0-3, default 2 (5.9).
        authorized_resolver: *id001
    Payload_legal_effect_declarations_adopt:
      type: object
      required:
      - civic_body_id
      - decision_class
      - legal_status
      - enabling_authority
      properties:
        civic_body_id: *id001
        decision_class: *id001
        legal_status:
          enum:
          - Consultative
          - Binding
        enabling_authority:
          type: string
          description: Citation of the law or charter provision that gives the result effect.
        effective_date: *id001
    Payload_compliance_packs_adopt:
      type: object
      required:
      - civic_body_id
      - pack_id
      - edition
      - rules
      properties:
        civic_body_id: *id001
        pack_id: *id001
        edition: *id001
        rules:
          type: array
          items:
            type: object
            required:
            - rule
            - effect
            properties:
              rule: *id001
              effect:
                enum:
                - add_constraint
                - relax
              legal_basis: *id001
              target: *id001
    Payload_change_requests_put_in_force:
      type: object
      required:
      - civic_body_id
      - target_type
      - target_id
      - changes
      - decision_id
      properties:
        civic_body_id: *id001
        target_type:
          enum:
          - delegation_envelope
          - governance_process
        target_id: *id001
        changes:
          type: object
        decision_id: *id001
    Payload_credentials_issue:
      type: object
      required:
      - civic_body_id
      - member_actor_id
      - tier
      properties:
        civic_body_id: *id001
        member_actor_id: *id001
        tier:
          enum:
          - self_attested
          - verified
        attestation_confidence: *id002
    Payload_interest_declarations_record:
      type: object
      required:
      - civic_body_id
      - proposition_id
      - description
      properties:
        civic_body_id: *id001
