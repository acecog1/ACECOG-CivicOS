  /v0/commands/change-requests.put-in-force:
    post:
      tags:
      - Civic body and rules
      operationId: change_requests_put_in_force
      summary: Put an approved change in force, once, exactly as approved (the decision names the target and a hash of the
        change). Applies only to transactions that start afterward.
      description: 'Specification: 8.9; CL-046. Enforces: DPP-IMMUTABLE-001, GOV-AUTHPATH-001.'
      x-spec-refs: 8.9; CL-046
      x-enforces:
      - DPP-IMMUTABLE-001
      - GOV-AUTHPATH-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandEnvelope'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/Payload_change_requests_put_in_force'
            examples:
              put_an_approved_change_in_force:
                summary: Put an approved change in force
                value:
                  command_id: c-0115
                  actor_id: ana
                  client: desktop
                  payload:
                    civic_body_id: cb-0001
                    target_type: governance_process
                    target_id: governance_process-0001
                    changes:
                      decision_classes:
                      - name: annual_budget
                        method: direct_vote
                        approval_threshold: 0.9
                        quorum: 0.5
                        min_attestation: verified
                        min_attestation_confidence: 0.75
                        delegation_disclosure_threshold: 0.05
                        delegation_reconfirm_days: 365
                      - name: routine_rebalance
                        method: consent
                        approval_threshold: 1.0
                        quorum: 0.5
                        min_attestation: verified
                        min_attestation_confidence: 0.75
                        delegation_disclosure_threshold: 0.05
                        delegation_reconfirm_days: 365
                      - name: minor_rebalance
                        method: consent
                        approval_threshold: 1.0
                        quorum: 0.5
                        min_attestation: verified
                        min_attestation_confidence: 0.75
                        delegation_disclosure_threshold: 0.05
                        delegation_reconfirm_days: 365
                      - name: change_control
                        method: direct_vote
                        approval_threshold: 0.6
                        quorum: 0.5
                        min_attestation: verified
                        min_attestation_confidence: 0.75
                        delegation_disclosure_threshold: 0.05
                        delegation_reconfirm_days: 365
                      - name: advisory_poll
                        method: direct_vote
                        approval_threshold: 0.5
                        quorum: 0.1
                        min_attestation: self_attested
                        min_attestation_confidence: 0.75
                        delegation_disclosure_threshold: 0.05
                        delegation_reconfirm_days: 365
                    decision_id: decision-0009
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '202':
