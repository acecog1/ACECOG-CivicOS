          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '422':
          description: Refused by a governance rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
