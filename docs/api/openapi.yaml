openapi: 3.1.0
info:
  title: ACECOG Civic OS API
  version: 0.1.0
  summary: Command and query contract derived from ACECOG v0.24 (change log CL-041).
  description: '**What this is.** The front counter of the ACECOG Civic OS: every request any client (desktop, conversational
    assistant, mobile)

    can make, and exactly what comes back, including refusals and escalations. Derived from the ACECOG specification (v0.24),

    Sections 7 (objects), 8 (state machines), 9 (provenance), 11.6 (one API, three clients), 14 (invariants), and 43.2 (Assurance
    Controls).


    **Two halves (11.6.2).** *Commands* change state and are all `POST /v0/commands/<name>`. *Queries* only read and are all
    `GET /v0/queries/...`.


    **Every command is a governed transaction (8.1).** It arrives in a `CommandEnvelope`, independently re-checks authority,

    binds to the rule versions in force when it starts (8.9), and returns a `CommandResult` whose `outcome` is one of:


    * `accepted` (HTTP 200): the change happened; `result` holds the new object versions.

    * `escalated` (HTTP 202): the action was routed to human authority as an Exception Proposition; nothing was decided automatically.

    * `refused` (HTTP 422): nothing changed; `refusal` names the rule, usually by invariant ID, so the reason can be traced
    to the spec.


    Refused and escalated commands are still recorded in the hash-chained event log.


    **Status (8.0).** Decisions, commitments and published results carry four separate status axes. Nothing is labeled binding

    without a Legal Effect Declaration (invariant 26 ASR-STATUS-001).


    **Assistant-drafted commands** must carry `human_confirmation` naming the person who reviewed the exact payload (24.3).


    **MVP status.** The reference implementation stores everything in one local SQLite file (spec 11.5) and solves with a

    small deterministic LP/QP solver (Phase 1 profile, 13.1). Caller authentication (WBS 1.3.2) is not yet in place: the

    actor_id in each command is trusted. Do not use for real decisions until it is.

    '
  license:
    name: Draft for review
servers:
- url: http://127.0.0.1:8765
  description: Local installation
tags:
- name: Civic body and rules
- name: Membership and participation
- name: Evidence and optimization
- name: Baseline, commitment, execution
- name: Records, exit, configuration
- name: Queries
paths:
  /v0/commands/civic-bodies.create:
    post:
      tags:
      - Civic body and rules
      operationId: civic_bodies_create
      summary: Create a civic body with its founding members.
      description: 'Specification: 7, 17.2, MVP-100.'
      x-spec-refs: 7, 17.2, MVP-100
      x-enforces: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandEnvelope'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/Payload_civic_bodies_create'
            examples:
              create_riverbend_commons:
                summary: Create Riverbend Commons
                value:
                  command_id: c-0001
                  actor_id: ana
                  client: desktop
                  payload:
                    name: Riverbend Commons
                    jurisdiction: Riverbend (reference scenario 26.1)
                    gml_level: 1
                    founding_members:
                    - actor_id: ana
                      display_name: Ana (Facilitator/Clerk)
                      roles:
                      - facilitator
                    - actor_id: ben
                      display_name: Ben (City Manager)
                      roles:
                      - city_manager
                    - actor_id: cara
                      display_name: Cara
                      roles:
                      - member
                    - actor_id: dev
                      display_name: Dev
                      roles:
                      - member
                    - actor_id: eli
                      display_name: Eli
                      roles:
                      - member
                    - actor_id: fay
                      display_name: Fay
                      roles:
                      - member
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '202':
          description: Escalated to human authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '422':
          description: Refused by a governance rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
  /v0/commands/governance-processes.adopt:
    post:
      tags:
      - Civic body and rules
      operationId: governance_processes_adopt
      summary: 'Adopt the rules for how each kind of decision is made: method, threshold, and who may take part.'
      description: 'Specification: 17.5, 4.2. Enforces: TRU-ACCESS-001, GOV-AUTHPATH-001.'
      x-spec-refs: 17.5, 4.2
      x-enforces:
      - TRU-ACCESS-001
      - GOV-AUTHPATH-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CommandEnvelope'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/Payload_governance_processes_adopt'
            examples:
              adopt_decision_classes:
                summary: Adopt decision classes
                value:
                  command_id: c-0003
                  actor_id: ana
                  client: desktop
                  payload:
                    civic_body_id: cb-0001
                    decision_classes:
                    - name: annual_budget
                      method: direct_vote
                      approval_threshold: 0.5
                      quorum: 0.5
                      min_attestation: verified
                    - name: routine_rebalance
                      method: consent
                      approval_threshold: 1.0
                      quorum: 0.5
                      min_attestation: verified
                    - name: minor_rebalance
                      method: consent
                      approval_threshold: 1.0
                      quorum: 0.5
                      min_attestation: verified
                    - name: change_control
                      method: direct_vote
                      approval_threshold: 0.6
                      quorum: 0.5
                      min_attestation: verified
                    - name: advisory_poll
                      method: direct_vote
                      approval_threshold: 0.5
                      quorum: 0.1
                      min_attestation: self_attested
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '202':
          description: Escalated to human authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '422':
          description: Refused by a governance rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
