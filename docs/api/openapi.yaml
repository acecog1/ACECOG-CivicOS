      - delegate_actor_id
      properties:
        civic_body_id: *id001
        decision_class: *id001
        delegate_actor_id: *id001
    Payload_delegations_revoke:
      type: object
      required:
      - civic_body_id
      - decision_class
      properties:
        civic_body_id: *id001
        decision_class: *id001
    Payload_propositions_submit:
      type: object
      required:
      - civic_body_id
      - decision_class
      - title
      - body
      - requested_action
      properties:
        civic_body_id: *id001
        decision_class: *id001
        title: *id001
        body: *id001
        requested_action:
          type: object
          description: Machine-readable action the proposition asks for (17.6), e.g. adopt_portfolio_model.
        competes_with:
