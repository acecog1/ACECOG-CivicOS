# BROWSER ONLY — feasibility test; not a publication/deploy workflow.
# Downloads Pyodide assets at build time, serves them from localhost, and proves
# the real civic solver runs in a Chromium Worker without a Python web server.
name: BG-2 sovereign browser feasibility
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned local engine and browser-test dependencies
        run: |
          pip install -r requirements-ci.txt
          npm ci --prefix scripts/site_checks
          cd scripts/site_checks
          npx playwright install --with-deps chromium
      - name: Extract and verify source-only browser distribution
        run: |
          python scripts/build_browser_lab.py
          python -m pytest -q tests/test_browser_lab_bundle.py
      - name: Vendor pinned Pyodide+SciPy into local static artifacts
        run: python scripts/vendor_browser_pyodide.py
      - name: Test actual local-only WebAssembly simulator in Chromium
        run: |
          python -m http.server 8781 --bind 127.0.0.1 --directory build/browser-lab > /tmp/browser-lab-server.log 2>&1 &
          sleep 2
          node --test scripts/site_checks/browser_sovereign.test.cjs
      - name: Report source/runtime artifacts without publishing
        if: always()
        run: |
          test -f build/browser-lab/source-manifest.json && sha256sum build/browser-lab/source-manifest.json || true
          test -f build/browser-lab/vendor/pyodide/acecog-runtime-manifest.json && sha256sum build/browser-lab/vendor/pyodide/acecog-runtime-manifest.json || true
      - name: NO Pages deployment
        run: echo "Test-only. Never publish from this workflow."
