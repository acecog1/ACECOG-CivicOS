# Manual, protected, fail-closed BG-2 first-publication PRE-FLIGHT.
# No deployment is possible from this workflow: a separate BG-2 host/publisher
# with independent rollout/rollback approval is still required.
name: BG-2 protected publication preflight (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed BG-2 Git source SHA-40
        required: true
        type: string
      review_run_id:
        description: Passing exact-head BG-2 WASM/ZIP Actions run ID
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of independently reviewed inner ZIP
        required: true
        type: string
      release_version:
        description: Staging label bg2-vMAJOR.MINOR
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: bg2-protected-release-preflight
  cancel-in-progress: false
jobs:
  review-only:
    # GitHub administrator must enable independent required reviewers.
    environment: bg2-publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      REVIEW_RUN: ${{ inputs.review_run_id }}
      ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
      VERSION_ID: ${{ inputs.release_version }}
      OWNER_GO: ${{ vars.BG2_OWNER_PUBLICATION_GO_SHA }}
      R1_QA_GO: ${{ vars.BG2_R1_INDEPENDENT_QA_SHA }}
      R2_QA_GO: ${{ vars.BG2_R2_INDEPENDENT_QA_SHA }}
      R3_QA_GO: ${{ vars.BG2_R3_INDEPENDENT_QA_SHA }}
      R4_QA_GO: ${{ vars.BG2_R4_INDEPENDENT_QA_SHA }}
      R5_PLAN_GO: ${{ vars.BG2_R5_PLAN_STEWARD_SHA }}
      LICENSE_QA_GO: ${{ vars.BG2_LICENSE_REVIEW_GO_SHA }}
      ENV_REVIEW_GO: ${{ vars.BG2_PROTECTED_ENV_AUDIT_SHA }}
      APPROVED_ZIP_HASH: ${{ vars.BG2_RELEASE_ARTIFACT_SHA256 }}
      APPROVED_SBOM_HASH: ${{ vars.BG2_APPROVED_SBOM_SHA256 }}
      DEDICATED_HOST_REPO: ${{ vars.BG2_DEDICATED_HOST_REPO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse absent/contradictory/unauthorized attestation before checkout
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$REVIEW_RUN" =~ ^[0-9]+$ ]] || exit 1
          [[ "$VERSION_ID" =~ ^bg2-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          for signed in "$OWNER_GO" "$R1_QA_GO" "$R2_QA_GO" "$R3_QA_GO" "$R4_QA_GO" "$R5_PLAN_GO" "$LICENSE_QA_GO" "$ENV_REVIEW_GO"; do
            test -n "$signed"
            test "$signed" = "$EXPECTED_SHA"
          done
          test "$APPROVED_ZIP_HASH" = "$ARCHIVE_SHA"
          [[ "$APPROVED_SBOM_HASH" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$DEDICATED_HOST_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || exit 1
          test "$DEDICATED_HOST_REPO" != "$GITHUB_REPOSITORY"
          test "$EXPECTED_SHA" != "4a28737b515bd6d652a05a971822c92aa0ec2057"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate approved source/run and download only exact source artifacts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN" --jq '.head_sha')" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN" --jq '.name')" = "BG-2 sovereign browser feasibility"
          mkdir -p build/bg2-controlled
          gh run download "$REVIEW_RUN" -R "$GITHUB_REPOSITORY" --name "bg2-review-only-$EXPECTED_SHA" --dir build/bg2-controlled
          gh run download "$REVIEW_RUN" -R "$GITHUB_REPOSITORY" --name "bg2-unapproved-runtime-evidence-$EXPECTED_SHA" --dir build/bg2-controlled
          test -f "build/bg2-controlled/bg2-review-$EXPECTED_SHA.zip"
          test -f build/bg2-controlled/bg2-sbom.cdx.json
          test -f build/bg2-controlled/publisher-root-verification.json
          printf '%s  %s\n' "$ARCHIVE_SHA" "build/bg2-controlled/bg2-review-$EXPECTED_SHA.zip" | sha256sum -c -
          printf '%s  %s\n' "$APPROVED_SBOM_HASH" build/bg2-controlled/bg2-sbom.cdx.json | sha256sum -c -
      - name: Independently verify complete exact Git-to-ZIP/official runtime/fictional scope
        run: |
          set -euo pipefail
          python scripts/package_bg2_candidate.py verify --source-sha "$EXPECTED_SHA" --output "build/bg2-controlled/bg2-review-$EXPECTED_SHA.zip"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from zipfile import ZipFile
          base=Path("build/bg2-controlled")
          with ZipFile(base/f"bg2-review-{os.environ['EXPECTED_SHA']}.zip") as z:
              receipt=json.loads(z.read("release-manifest.json"))
          sbom=json.loads((base/"bg2-sbom.cdx.json").read_text())
          root=json.loads((base/"publisher-root-verification.json").read_text())
          assert receipt["source_revision"]==os.environ["EXPECTED_SHA"]
          assert receipt["runtime_pin_status"]=="EXACT_PINSET_VERIFIED_PENDING_INDEPENDENT_QA"
          assert receipt["scenario_kind"]=="abbreviated-isolated-synthetic-not-279-event-fork"
          assert receipt["releasable"] is False
          assert sbom["bomFormat"]=="CycloneDX" and sbom["specVersion"]=="1.6"
          assert root["root_files_verified"] is True
          assert root["independent_QA_signoff"]=="REQUIRED"
          PY
      - name: Archive preflight receipt ONLY — BG-1 and public Pages unchanged
        run: |
          set -euo pipefail
          mkdir -p build/bg2-prepublication
          printf '%s\n' "BG-2 preflight, NOT PUBLIC DEPLOYMENT" \
            "source_sha=$EXPECTED_SHA" "zip_sha256=$ARCHIVE_SHA" \
            "review_run=$REVIEW_RUN" "version=$VERSION_ID" \
            "dedicated_host_repository=$DEDICATED_HOST_REPO" \
            "independent host deploy/rollback still needs a separate signed action" \
            > build/bg2-prepublication/receipt.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bg2-preflight-only-${{ inputs.source_sha }}
          path: build/bg2-prepublication/receipt.txt
          if-no-files-found: error
      # No deploy-pages action, repo write token, DNS or GoDaddy mutation.
