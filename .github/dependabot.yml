# Dependabot version updates (free on private and public repositories).
# Opens pull requests when pinned Python packages or GitHub Actions have newer releases.
# Strict-mode replay records the solver version (OPT-REPRO-001), so review solver bumps (numpy, scipy)
# with the replay tests before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      solver:
        patterns: ["numpy", "scipy"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
